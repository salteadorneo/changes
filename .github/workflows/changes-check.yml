name: Changes Check

on:
  schedule:
    - cron: '*/15 * * * *'
  
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  check:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Install Chromium
        run: |
          npm install --save-optional puppeteer
          npx puppeteer browsers install chrome

      - name: Run change detection
        run: npm run build
        env:
          PUPPETEER_SKIP_DOWNLOAD: true
          PUPPETEER_EXECUTABLE_PATH: /usr/bin/chromium-browser

      # - name: Cleanup old screenshots
      #   run: npm run cleanup

      - name: Commit and push changes
        continue-on-error: true
        run: |
          git config user.name "Changes Monitor"
          git config user.email "changes-monitor@github.local"
          git add -A
          git commit -m "[skip ci] Changes detected $(date -u +'%Y-%m-%d %H:%M:%S')" || true
          git push

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
        continue-on-error: true

      - name: Deploy pages
        uses: actions/deploy-pages@v3
        continue-on-error: true
