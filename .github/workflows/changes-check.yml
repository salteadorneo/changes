name: Changes Check

# Runs only when triggered manually (Actions tab > "Run workflow").
# This is a template: nothing happens until you ask for it.
# Want automatic runs? Uncomment the schedule below.
on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

# Never let two checks run at the same time
concurrency:
  group: changes-check
  cancel-in-progress: true

jobs:
  check:
    env:
      IS_TEMPLATE: ${{ secrets.IS_TEMPLATE }}
    environment:
      name: github-pages
      url: ${{ steps.deploy-pages.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        if: env.IS_TEMPLATE != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # puppeteer-core is an optional dependency and uses the Chrome that
      # already ships with the runner - no browser download needed.
      - name: Install dependencies
        if: env.IS_TEMPLATE != 'true'
        run: npm ci --no-audit

      # State (hashes, history and screenshots) lives in the Actions cache
      # instead of in the repository, so nothing generated is ever committed.
      # Delete the "Save state" step below if you don't need change history.
      - name: Restore state
        if: env.IS_TEMPLATE != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            api
            screenshots
          key: changes-state-${{ github.run_id }}
          restore-keys: changes-state-

      - name: Run change detection
        if: env.IS_TEMPLATE != 'true'
        run: npm run build

      - name: Prepare site
        run: |
          mkdir -p _site
          if [ "$IS_TEMPLATE" = "true" ]; then
            # Template repository: publish the whole marketing landing tree
            # (root auto-detects the browser language into /es/ or /en/).
            cp -r landing/* _site/
            VERSION=$(grep '"version"' package.json | head -1 | sed -E 's/.*"version": *"([^"]+)".*/\1/')
            for f in _site/index.html _site/es/index.html _site/en/index.html; do
              if [ -f "$f" ]; then sed -i "s/__VERSION__/$VERSION/g" "$f"; fi
            done
          else
            cp index.html _site/
            touch _site/.nojekyll
            for dir in source api screenshots; do
              if [ -d "$dir" ]; then cp -r "$dir" _site/; fi
            done
          fi
          if [ -f CNAME ]; then cp CNAME _site/; fi
          touch _site/.nojekyll
          ls -R _site

      # Deploy only the generated site - never node_modules or .git
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      # Skip this step if you are not publishing to GitHub Pages
      - name: Deploy to GitHub Pages
        id: deploy-pages
        uses: actions/deploy-pages@v4

      # Runs after the deploy so the links in the issue are already live.
      # Never fails the run: a broken notification must not block the site.
      - name: Notify changes as GitHub Issues
        if: env.IS_TEMPLATE != 'true'
        continue-on-error: true
        run: npm run notify
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}

      # Must come last: the notify step writes api/<id>/notified.json and that
      # file has to land in the cache, otherwise the same change alerts twice.
      - name: Save state
        if: env.IS_TEMPLATE != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            api
            screenshots
          key: changes-state-${{ github.run_id }}
          if-no-files-found: ignore