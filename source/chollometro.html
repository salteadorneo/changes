<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>chollometro - Change Monitor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    @property --_slider {
      syntax: "<number>";
      inherits: true;
      initial-value: 50;
    }

    .comparison-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 8px;
    }
    
    .comparison-container img {
      width: 100%;
      height: auto;
      display: block;
      border-radius: 4px;
    }
    
    .comparison-img-before {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      clip-path: inset(0 calc(100% - var(--_slider) * 1%) 0 0);
      pointer-events: none;
      animation: --_timeline linear forwards;
      animation-timeline: view();
    }
    
    .container {
      max-width: 1000px;
      margin: 0 auto;
    }
    
    .header {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      padding: 30px 20px;
      border-radius: 8px 8px 0 0;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .header h1 {
      font-size: 28px;
      margin: 0;
    }
    
    .back-link {
      background: rgba(255,255,255,0.2);
      color: white;
      padding: 8px 16px;
      border-radius: 4px;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.2s;
    }
    
    .back-link:hover {
      background: rgba(255,255,255,0.3);
    }
    
    .content {
      background: #f8f9fa;
      padding: 30px 20px;
    }
    
    .footer {
      background: white;
      padding: 15px 20px;
      text-align: center;
      font-size: 12px;
      color: #999;
      border-top: 1px solid #eee;
      border-radius: 0 0 8px 8px;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }
    
    code {
      background: #f0f0f0;
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Monaco', 'Menlo', 'Consolas', monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div>
        <h1>chollometro</h1>
        <div style="font-size: 12px; opacity: 0.9; margin-top: 4px;">Change history timeline</div>
      </div>
      <a href="../index.html" class="back-link">← Volver</a>
    </div>
    
    <div class="content">
      
        <div style="background: #e8f5e9; border: 1px solid #4caf50; border-radius: 8px; padding: 24px; text-align: center; color: #2e7d32;">
          <div style="font-size: 32px; margin-bottom: 8px;">✓</div>
          <div style="font-size: 16px; font-weight: 600;">Sin cambios detectados</div>
          <div style="font-size: 12px; margin-top: 8px; opacity: 0.8;">Aún no se han registrado cambios en esta fuente</div>
        </div>
      
    </div>
    
    <div class="footer">
      <div style="margin-bottom: 8px;">
        Última actualización: 30/01/2026, 02:25:15
      </div>
      <div style="font-size: 11px;">
        Change Monitor v1.0.0
      </div>
    </div>
  </div>
</body>
</html>
